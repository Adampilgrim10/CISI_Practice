<style>

.opt:hover{border-color:var(--blue);background:var(--bluebg)}

.qdot{width:34px;height:34px;border-radius:4px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s}
.qdot:hover{border-color:var(--navy);color:var(--navy)}
.qdot.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.qdot.ans{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.qdot.ok{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.qdot.bad{background:var(--redbg);border-color:var(--red);color:var(--red)}
#res{display:none;min-height:100vh;background:var(--paper)}
.rh{background:linear-gradient(135deg,var(--navy),var(--navy-mid));padding:52px 20px;text-align:center}
.rl{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;font-weight:700}
.rv{font-size:clamp(36px,6vw,60px);font-weight:800;color:#fff;margin-bottom:6px}
.rs{font-size:clamp(60px,10vw,100px);font-weight:800;color:var(--gold);line-height:1;margin-bottom:8px}
.rd{color:rgba(255,255,255,0.45);font-size:14px}
.rb{max-width:760px;margin:40px auto;padding:0 20px}
.rbt{font-size:22px;font-weight:700;margin-bottom:20px;color:var(--ink)}
.chrow{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.chname{flex:1;font-size:13px}
.chbar{width:140px;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.chbar-f{height:100%;border-radius:4px}
.chsc{font-size:12px;font-weight:700;min-width:55px;text-align:right}
.ract{display:flex;gap:12px;justify-content:center;padding:0 20px 60px;flex-wrap:wrap}
.rbtn{padding:12px 28px;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s}
.rbtn.p{background:var(--navy);color:#fff;border:none}
.rbtn.p:hover{background:var(--navy-mid)}
.rbtn.s{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.rbtn.s:hover{background:var(--navy);color:#fff}
.rbtn.h{background:#fff;color:var(--muted);border:1.5px solid var(--border)}
.rbtn.h:hover{border-color:var(--navy);color:var(--navy)}
@media(max-width:680px){.sb{display:none}.layout{padding:16px 12px 48px}}
</style>

<script>
var Q=[
{ch:1,n:"Financial Services Industry",r:"1.1.1",q:"Which of the following BEST describes the wholesale sector of the financial services industry?",o:["Business-to-consumer services including retail banking and insurance","Business-to-business services including equity markets, bond markets and fund management","Services provided exclusively by government-owned institutions","Services provided to small and medium-sized enterprises only"],a:1},
{ch:1,n:"Financial Services Industry",r:"1.1.1",q:"Which of the following is a key activity of investment banks in the wholesale sector?",o:["Providing current accounts and deposit facilities to retail customers","Underwriting and bookbuilding new issues of securities for capital raising","Offering robo-advisory investment services to retail clients","Providing mortgage lending to individual homeowners"],a:1},
{ch:1,n:"Financial Services Industry",r:"1.1.2",q:"Which type of retail sector participant is MOST likely to invest in long-term assets such as equities and bonds to fund retirement obligations?",o:["Retail bank","Pension fund","Robo-advisor","Current account provider"],a:1},
{ch:1,n:"Financial Services Industry",r:"1.1.2",q:"A financial planner who is legally and ethically bound to put a client's interests ahead of their own is described as a:",o:["Broker-dealer","Fiduciary","Custodian","Market maker"],a:1},
{ch:1,n:"Financial Services Industry",r:"1.1.3",q:"Which wholesale sector participant is primarily responsible for the safekeeping of assets, settlement of securities and collection of dividends on behalf of fund managers?",o:["Investment bank","Fund manager","Custodian bank","Corporate broker"],a:2},
{ch:1,n:"Financial Services Industry",r:"1.1.3",q:"Which of the following BEST describes the role of a stockbroker acting as an agent?",o:["The broker buys and sells securities for their own account","The broker arranges trades on behalf of clients, earning a commission","The broker underwrites new issues of shares for companies","The broker provides safe custody of client assets"],a:1},
{ch:2,n:"Asset Classes",r:"2.2.1",q:"Which of the following is TRUE regarding ordinary shareholders' voting rights?",o:["Votes are proportional to the total number of shareholders","Unused votes may be reallocated by the company chairman","A shareholder may appoint a proxy to vote on their behalf","Shareholders must attend extraordinary general meetings in person"],a:2},
{ch:2,n:"Asset Classes",r:"2.2.2",q:"Which type of preference share entitles the holder to receive unpaid dividends from prior years before any ordinary dividend is paid?",o:["Redeemable","Participating","Cumulative","Convertible"],a:2},
{ch:2,n:"Asset Classes",r:"2.3.1",q:"Which of the following statements BEST distinguishes bonds from equities?",o:["Bonds confer voting rights whereas equities do not","Bond investors lend money to the issuer and have an agreed repayment date; equity investors hold an ownership stake","Equities always outperform bonds over any time period","Bond issuers are not required to make contractual interest payments"],a:1},
{ch:2,n:"Asset Classes",r:"2.3.1",q:"What is the nominal value of a bond?",o:["The current market price of the bond","The total interest paid over the life of the bond","The amount the borrower will repay to the bondholder at maturity","The annual coupon expressed as a percentage of the market price"],a:2},
{ch:2,n:"Asset Classes",r:"2.3.2",q:"The MOST accurate description of modified duration is that it:",o:["Predicts the price movement of a bond given a change in its yield","Calculates the gross redemption yield of a bond","Identifies the issuer's credit rating","Measures the time until the next coupon payment"],a:0},
{ch:2,n:"Asset Classes",r:"2.3.3",q:"A bond with a 6% annual coupon and 182 days of accrued interest (non-leap year, actual/actual convention) on £100 nominal. What is the accrued interest?",o:["£2.99","£3.00","£2.78","£3.25"],a:0},
{ch:2,n:"Asset Classes",r:"2.3.2",q:"What is the flat yield of a bond with a 5% coupon trading at £95 per £100 nominal?",o:["4.75%","5.00%","5.26%","5.56%"],a:2},
{ch:2,n:"Asset Classes",r:"2.3.6",q:"What is the present value of a £100 nominal zero coupon bond redeemable in 3 years at a discount rate of 5%?",o:["£86.38","£85.00","£90.70","£88.90"],a:0},
{ch:2,n:"Asset Classes",r:"2.4.3",q:"A company wishes to issue zero coupon bonds. These will be priced:",o:["At a premium to face value","At a discount to face value","At nominal value","At a premium or discount depending on the issuer's credit rating"],a:1},
{ch:2,n:"Asset Classes",r:"2.3.4",q:"Which of the following describes the yield curve under normal economic conditions?",o:["Inverted, with short-term rates higher than long-term rates","Flat, with all maturities at the same rate","Upward-sloping, with long-term rates higher than short-term rates","Downward-sloping from the two-year point"],a:2},
{ch:2,n:"Asset Classes",r:"2.4.4",q:"German Bobls are government bonds issued by Germany. Which of the following is TRUE regarding their maturity period?",o:["They are typically issued with a maturity of 10 years","They typically have a shorter maturity than Japanese Government Bonds (JGBs)","They pay coupons on a semi-annual basis","They are denominated in US dollars"],a:1},
{ch:2,n:"Asset Classes",r:"2.5.1",q:"Which of the following may be funded by the interest and principal payments from an asset-backed security?",o:["Payments received from a pool of underlying loan assets","Guarantees from a central bank","Interest payments from overseas sovereign bonds","The proceeds of an initial public offering"],a:0},
{ch:2,n:"Asset Classes",r:"2.1.2",q:"What return does an investor in Treasury Bills receive?",o:["A fixed semi-annual coupon","A variable coupon linked to base rate","A return determined by the price paid at issue (discount to par)","A return based on the issuer's credit rating"],a:2},
{ch:2,n:"Asset Classes",r:"2.1.4",q:"In a repurchase agreement (repo), what does the repo rate represent?",o:["The amount of collateral required by the lender","The implied interest rate embedded in the terms of the repo","The haircut applied to collateral","The margin call threshold"],a:1},
{ch:2,n:"Asset Classes",r:"2.1.3",q:"Which financial instrument is ALWAYS issued at a discount to par?",o:["Eurobond","Gilt","Commercial paper","Debenture"],a:2},
{ch:2,n:"Asset Classes",r:"2.8.1",q:"Spot transactions in the foreign exchange market are normally settled within a maximum of how many working days?",o:["1","2","3","5"],a:1},
{ch:2,n:"Asset Classes",r:"2.8.1",q:"In a EUR/USD exchange rate quote, the US dollar is described as the:",o:["Base currency","Counter currency","Cross currency","Bid currency"],a:1},
{ch:2,n:"Asset Classes",r:"2.8.2",q:"If GBP/USD spot is 1.2500 and UK annual interest rates are 4% while US rates are 2%, what is the approximate one-year forward rate?",o:["1.2252","1.2748","1.2500","1.2300"],a:0},
{ch:2,n:"Asset Classes",r:"2.8.3",q:"The theory that a country's currency will weaken against another if it has a higher inflation rate is known as:",o:["Interest rate parity","Purchasing power parity","Covered interest arbitrage","Forward rate theory"],a:1},
{ch:2,n:"Asset Classes",r:"2.9.2",q:"A key benefit of purchasing shares in an investment trust compared to a unit trust is:",o:["Investment trusts always outperform unit trusts","Investors can potentially buy at a discount to net asset value","Investment trusts offer a single price for buying and selling","Investment trusts have lower regulatory requirements"],a:1},
{ch:2,n:"Asset Classes",r:"2.9.1",q:"An investor in an unregulated collective investment scheme should be made aware that:",o:["The fund must hold a diversified range of assets","The fund is prohibited from using leverage","Such an investment should be considered long-term","Performance fees are prohibited"],a:2},
{ch:2,n:"Asset Classes",r:"2.7.3",q:"A key benefit of investing in a Real Estate Investment Trust (REIT) compared with direct residential property is that:",o:["REITs are exempt from all forms of taxation","Stamp duty is payable at a reduced rate on REIT shares","REITs reduce exposure to liquidity risk compared with direct property","REIT dividend income is always tax-free"],a:2},
{ch:2,n:"Asset Classes",r:"2.9.4",q:"When considering private equity funds, a fund manager should be aware that:",o:["Returns are typically uncorrelated with the economic cycle","Such funds cannot be marketed to retail clients","Performance fees are not permitted","Returns are usually correlated with the economic cycle"],a:3},
{ch:2,n:"Asset Classes",r:"2.1.1",q:"A key risk for a UK investor placing deposits in an overseas bank is that:",o:["They will always pay higher taxation than on UK deposits","They will receive lower interest rates","They may face exchange controls when repatriating funds","They will automatically lose FSCS protection"],a:2},
{ch:3,n:"Markets",r:"3.1.1",q:"Which of the following is the MOST accurate description of the secondary market?",o:["The market where companies raise new capital via an IPO","The market where already-listed securities are freely bought and sold","The market where companies make offers for subscription","The market for private placements only"],a:1},
{ch:3,n:"Markets",r:"5.2.1",q:"Which of the following is a key characteristic of an order-driven market?",o:["Market makers are obliged to provide two-way prices","Prices are set by dealers negotiating directly by telephone","Orders from buyers and sellers are automatically matched and executed","Price quotes must be displayed throughout the mandatory quote period"],a:2},
{ch:3,n:"Markets",r:"5.2.1",q:"A quote-driven market uses which of the following pricing systems?",o:["Single price auction","Order book matching","Two-way prices provided by market makers","Periodic call auction"],a:2},
{ch:3,n:"Markets",r:"5.1.4",q:"Why would an investment bank use a 'dark pool' to sell a large block of securities?",o:["To sell a small quantity of shares quickly at best execution","To benefit from a wider range of retail investors","To sell a large quantity of shares without disclosing the transaction to the wider market","To comply with MiFID II pre-trade transparency requirements"],a:2},
{ch:4,n:"Primary Markets",r:"4.1.1",q:"Which of the following would MOST typically lead and manage the sale of shares in an Initial Public Offering?",o:["Reporting accountants","A syndicate led by an investment bank","An insurance company acting as underwriter","The company's legal advisers"],a:1},
{ch:4,n:"Primary Markets",r:"4.1.4",q:"Which method of bringing a company to market is the LEAST expensive?",o:["Offer for sale","Offer for subscription","Introduction","Placing"],a:2},
{ch:4,n:"Primary Markets",r:"4.2.1",q:"During a new issue, who are normally the members of the underwriting syndicate?",o:["The sponsor, legal team and accountants","The lead manager and co-managers","Reporting accountants only","The corporate broker and legal advisers"],a:1},
{ch:4,n:"Primary Markets",r:"4.2.2",q:"Which part of the origination team is MOST likely to assess the best method of bringing a company to market?",o:["The legal adviser","The reporting accountant","The sponsor","The corporate broker"],a:2},
{ch:4,n:"Primary Markets",r:"4.2.3",q:"Which part of the origination team is responsible for carrying out due diligence on the prospectus?",o:["The legal adviser and reporting accountant","The sponsor only","The corporate broker and legal adviser","The listing agent only"],a:0},
{ch:4,n:"Primary Markets",r:"4.2.3",q:"Which of the following is a corporate governance expectation for a company planning to list securities?",o:["A listing agent must be appointed at least 12 months in advance","Non-executive directors from unrelated industries must constitute a majority","The roles of chairman and chief executive should be separated","The company must have a minimum market capitalisation of £500m"],a:2},
{ch:4,n:"Primary Markets",r:"4.2.4",q:"What is the primary benefit of underwriting to an issuing company?",o:["It reduces the fees payable to the stock exchange","It guarantees that all shares will be sold and minimum proceeds received","It increases the likelihood of a better price for the shares","It allows the issue to proceed more quickly"],a:1},
{ch:4,n:"Primary Markets",r:"4.2.5",q:"Stabilisation in a new issue benefits investors primarily because it prevents:",o:["Partial order fills","Substantial losses from large price falls","Insiders from short selling the stock","Large orders receiving priority execution"],a:1},
{ch:4,n:"Primary Markets",r:"4.2.1",q:"A large US company is listing on both the New York and London Stock Exchanges. A London-based investment bank is responsible for the UK listing only. Its role in the syndicate would MOST LIKELY be described as:",o:["Sponsor","Book runner","Co-lead manager","Co-manager"],a:3},
{ch:4,n:"Primary Markets",r:"4.3.2",q:"A firm of accountants has been appointed as 'nomad' for a company listed on the Alternative Investment Market (AIM). This confirms that:",o:["The company is applying for a full premium listing","The nomad has been approved by the London Stock Exchange","The nomad will act jointly with the existing financial adviser","The company is seeking to significantly increase its share capital"],a:1},

var cur=0,answers=[],revealed=[],examMode=true,sLeft=7200,ti=null;

function startExam(){answers=new Array(Q.length).fill(null);revealed=new Array(Q.length).fill(false);document.getElementById('cover').style.display='none';document.getElementById('exam-shell').style.display='block';buildGrid();renderQ(0);ti=setInterval(tick,1000);}
function tick(){sLeft--;if(sLeft<=0){clearInterval(ti);submitExam();return;}var h=Math.floor(sLeft/3600),m=Math.floor((sLeft%3600)/60),s=sLeft%60;var d=document.getElementById('tmr');d.textContent=h+':'+p2(m)+':'+p2(s);if(sLeft<=600)d.classList.add('warn');else d.classList.remove('warn');}
function p2(n){return n<10?'0'+n:''+n;}
function buildGrid(){var g=document.getElementById('grid');g.innerHTML='';for(var i=0;i<Q.length;i++){(function(idx){var d=document.createElement('div');d.className='qdot'+(idx===0?' cur':'');d.id='d'+idx;d.textContent=idx+1;d.addEventListener('click',function(){goTo(idx);});g.appendChild(d);})(i);}}
function upDot(i){var d=document.getElementById('d'+i);if(!d)return;d.className='qdot';if(i===cur)d.classList.add('cur');if(!examMode&&answers[i]!==null)d.classList.add(answers[i]===Q[i].a?'ok':'bad');else if(answers[i]!==null)d.classList.add('ans');}
function renderQ(idx){cur=idx;var q=Q[idx];var p=document.getElementById('qpanel');var oh='';for(var i=0;i<q.o.length;i++){var c='opt';if(!examMode&&revealed[idx]){if(i===q.a)c+=' show-right';else if(i===answers[idx]&&answers[idx]!==q.a)c+=' wrong';else c+=' dis';}else if(answers[idx]===i)c+=' sel';oh+='<div class="'+c+'" data-i="'+i+'"><div class="opt-l">'+L[i]+'</div><div class="opt-t">'+q.o[i]+'</div></div>';}
var fb='';if(!examMode&&revealed[idx]&&answers[idx]!==null){var ok=answers[idx]===q.a;fb='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'&#10003; Correct':'&#10007; Incorrect &mdash; correct answer: <strong>'+L[q.a]+': '+q.o[q.a]+'</strong>')+'<br><small style="opacity:0.65;display:block;margin-top:4px">Syllabus ref: '+q.r+'</small></div>';}
var ac=answers.filter(function(a){return a!==null;}).length;var nr=idx<Q.length-1?'<button class="nbtn p" id="nb">Next &#8594;</button>':'<button class="nbtn p" id="sq">Submit Exam</button>';p.innerHTML='<div class="ch-tag">Ch'+q.ch+' &middot; '+q.n+'</div><div class="qnum">Question '+(idx+1)+' of '+Q.length+'</div><div class="qtext">'+q.q+'</div><div class="opts">'+oh+'</div>'+fb+'<div class="qnav"><button class="nbtn" id="pb"'+(idx===0?' disabled':'')+'>&#8592; Previous</button><span style="font-size:12px;color:var(--muted)">'+ac+'/'+Q.length+' answered</span>'+nr+'</div>';
document.getElementById('qn').textContent=idx+1;document.getElementById('prog').style.width=(((idx+1)/Q.length)*100)+'%';
var os=p.querySelectorAll('.opt');for(var k=0;k<os.length;k++){(function(el,oi){el.addEventListener('click',function(){pick(oi);});})(os[k],parseInt(os[k].getAttribute('data-i')));}
var pb=document.getElementById('pb');if(pb)pb.addEventListener('click',function(){goTo(cur-1);});var nb=document.getElementById('nb');if(nb)nb.addEventListener('click',function(){goTo(cur+1);});var sq=document.getElementById('sq');if(sq)sq.addEventListener('click',confirmSubmit);
for(var n=0;n<Q.length;n++)upDot(n);}
function pick(i){if(revealed[cur])return;answers[cur]=i;if(!examMode)revealed[cur]=true;renderQ(cur);}
function goTo(i){if(i<0||i>=Q.length)return;renderQ(i);}
function confirmSubmit(){var u=answers.filter(function(a){return a===null;}).length;if(u>0&&!confirm(u+' question(s) unanswered. Submit anyway?'))return;submitExam();}
function submitExam(){clearInterval(ti);examMode=false;for(var i=0;i<Q.length;i++)if(answers[i]!==null)revealed[i]=true;showResults();}
function showResults(){document.getElementById('exam-shell').style.display='none';document.getElementById('res').style.display='block';var sc=Q.reduce(function(a,q,i){return a+(answers[i]===q.a?1:0);},0);var pass=sc>=70;var v=document.getElementById('verdict');v.textContent=pass?'PASS':'FAIL';v.style.color=pass?'#4ade80':'#f87171';document.getElementById('score').textContent=sc+'/'+Q.length;var used=7200-sLeft,h=Math.floor(used/3600),m=Math.floor((used%3600)/60),s=used%60;document.getElementById('rdetail').textContent=sc+'% &middot; Pass mark 70% &middot; Time used: '+h+'h '+p2(m)+'m '+p2(s)+'s';var chs={};Q.forEach(function(q,i){if(!chs[q.ch])chs[q.ch]={n:q.n,t:0,c:0};chs[q.ch].t++;if(answers[i]===q.a)chs[q.ch].c++;});var html='';Object.keys(chs).forEach(function(ch){var d=chs[ch],pct=Math.round((d.c/d.t)*100);var col=pct>=70?'#166534':pct>=50?'#92400e':'#991b1b';html+='<div class="chrow"><div class="chname"><strong>Ch'+ch+'</strong> '+d.n+'</div><div class="chbar"><div class="chbar-f" style="width:'+pct+'%;background:'+col+'"></div></div><div class="chsc" style="color:'+col+'">'+d.c+'/'+d.t+'</div></div>';});document.getElementById('chbd').innerHTML=html;}
function reviewAnswers(){document.getElementById('res').style.display='none';document.getElementById('exam-shell').style.display='block';examMode=false;for(var i=0;i<Q.length;i++)revealed[i]=true;renderQ(0);}
function restartExam(){answers=new Array(Q.length).fill(null);revealed=new Array(Q.length).fill(false);examMode=true;sLeft=7200;document.getElementById('res').style.display='none';document.getElementById('tmr').textContent='2:00:00';document.getElementById('tmr').classList.remove('warn');document.getElementById('exam-shell').style.display='block';buildGrid();renderQ(0);ti=setInterval(tick,1000);}
